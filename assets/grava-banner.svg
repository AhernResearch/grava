    <text y="100" font-size="112" font-weight="800" letter-spacing="9">GRAVA</text>
    <rect y="129" width="92" height="5" rx="2.5" fill="#65e2d7"/>
    <text y="180" font-size="25" font-weight="600" fill="#d9f8f5">Grounded Reasoning-to-Action</text>
    <text y="218" font-size="22" fill="#b8d8e8">Representation and Learning for Autonomous Driving</text>
