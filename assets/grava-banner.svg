<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">GRAVA</title>
  <desc id="desc">Grounded Reasoning-to-Action for autonomous driving</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162c"/>
      <stop offset="0.55" stop-color="#10365f"/>
      <stop offset="1" stop-color="#0c7c86"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e2d7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8edcff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="430" rx="30" fill="url(#bg)"/>
  <circle cx="1190" cy="76" r="220" fill="#30c6b9" opacity="0.08"/>
  <circle cx="130" cy="390" r="230" fill="#4e9eff" opacity="0.08"/>

  <g transform="translate(835 58)">
    <path d="M30 286 C160 260 222 210 280 126 C327 58 397 40 510 38" fill="none" stroke="#b8d8e8" stroke-opacity="0.18" stroke-width="114" stroke-linecap="round"/>
    <path d="M30 286 C160 260 222 210 280 126 C327 58 397 40 510 38" fill="none" stroke="url(#road)" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 13" filter="url(#glow)"/>
    <g fill="#0c2949" stroke="#65e2d7" stroke-width="2">
      <rect x="66" y="211" width="72" height="49" rx="8"/>
      <rect x="231" y="116" width="72" height="49" rx="8"/>
      <rect x="391" y="25" width="72" height="49" rx="8"/>
